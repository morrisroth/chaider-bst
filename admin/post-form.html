<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>עריכת פוסט — חיידר בעל שם טוב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../flow.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar">
    <a class="sidebar-logo" href="/admin/dashboard"><img class="logo-mark" src="/assets/logo.png" alt="חיידר בעל שם טוב"><span><span>חיידר בעל שם טוב</span><br><small>פאנל ניהול</small></span></a>
    <nav class="sidebar-nav">
      <div class="sidebar-section">ראשי</div>
      <a href="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>לוח בקרה</a>
      <div class="sidebar-section">תוכן</div>
      <a href="posts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/></svg>חדשות ואירועים</a>
      <a href="gallery"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>גלריה</a>
      <div class="sidebar-section">הרשמה</div>
      <a href="registrations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>הרשמות</a>
      <a href="inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>תיבת דואר</a>
      <div class="sidebar-section">מסמכים</div>
      <a href="documents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 15l2 2 4-4"/></svg>מסמכים לחתימה</a>
      <div class="sidebar-section">הגדרות</div>
      <a href="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/></svg>הגדרות האתר</a>
    </nav>
    <div class="sidebar-footer"><span id="admin-username"></span> · <a href="#" onclick="logout()">יציאה</a></div>
  </aside>

  <div class="admin-main">
    <div class="admin-topbar">
      <div><h1 id="pageTitle">פוסט חדש</h1><div class="breadcrumb"><a href="posts">חדשות ואירועים</a> / עריכה</div></div>
      <div class="topbar-actions">
        <a href="posts" class="btn btn-line btn-sm">← חזרה</a>
        <button class="btn btn-grad btn-sm" onclick="save()">שמירה</button>
      </div>
    </div>
    <div class="admin-body">
      <div id="alert" class="alert" style="display:none"></div>
      <div style="display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start">
        <!-- Main -->
        <div>
          <div class="form-panel">
            <div class="form-group">
              <label>כותרת *</label>
              <input type="text" id="title" placeholder="כותרת הפוסט" required />
            </div>
            <div class="form-group">
              <label>תקציר</label>
              <textarea id="excerpt" rows="3" placeholder="משפט תקציר קצר..."></textarea>
            </div>
            <div class="form-group">
              <label>תוכן</label>
              <textarea id="content" rows="12" placeholder="תוכן הפוסט המלא..."></textarea>
            </div>
          </div>
          <!-- Image -->
          <div class="form-panel">
            <h2>תמונה ראשית</h2>
            <div class="img-upload-box" id="imgBox" onclick="document.getElementById('imgFile').click()">
              <img id="imgPreview" src="" style="display:none" />
              <p id="imgPlaceholder">לחצו להעלאת תמונה<br><small style="color:var(--muted)">JPG, PNG, WebP · עד 10MB</small></p>
              <input type="file" id="imgFile" accept="image/*" style="display:none" onchange="uploadImg(this)" />
            </div>
            <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
              <input type="text" id="imgUrl" placeholder="או הכניסו URL ישירות" style="flex:1;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:14px;font-family:inherit;direction:ltr" oninput="setImgUrl(this.value)" />
              <button class="btn btn-line btn-sm" onclick="clearImg()">נקה</button>
            </div>
          </div>
        </div>
        <!-- Sidebar -->
        <div>
          <div class="form-panel">
            <h2>פרסום</h2>
            <div class="toggle-row">
              <div><div class="toggle-label">פורסם</div><div class="toggle-sub">גלוי לכל המבקרים</div></div>
              <label class="toggle"><input type="checkbox" id="published" /><span class="toggle-track"></span></label>
            </div>
            <div class="toggle-row">
              <div><div class="toggle-label">מומלץ</div><div class="toggle-sub">מוצג בדף הבית</div></div>
              <label class="toggle"><input type="checkbox" id="featured" /><span class="toggle-track"></span></label>
            </div>
            <div class="form-group" style="margin-top:16px">
              <label>קטגוריה</label>
              <select id="category">
                <option>כללי</option><option>אירועים</option><option>טיולים</option><option>שבתות</option><option>לימוד</option>
              </select>
            </div>
            <div class="form-group">
              <label>תאריך</label>
              <input type="date" id="date" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="admin.js"></script>
<script>
requireAuth();
const params = new URLSearchParams(location.search);
const postId = params.get('id');
let imgUrlVal = '';

if (postId) {
  document.getElementById('pageTitle').textContent = 'עריכת פוסט';
  api('GET', `/posts/admin/${postId}`).then(p => {
    if (!p) return;
    document.getElementById('title').value = p.title;
    document.getElementById('excerpt').value = p.excerpt;
    document.getElementById('content').value = p.content;
    document.getElementById('category').value = p.category;
    document.getElementById('date').value = p.date;
    document.getElementById('published').checked = !!p.published;
    document.getElementById('featured').checked = !!p.featured;
    if (p.image) setImgUrl(p.image);
  });
} else {
  document.getElementById('date').value = new Date().toISOString().slice(0,10);
}

function setImgUrl(url) {
  imgUrlVal = url;
  document.getElementById('imgUrl').value = url;
  const prev = document.getElementById('imgPreview');
  if (url) { prev.src = url; prev.style.display = 'block'; document.getElementById('imgPlaceholder').style.display = 'none'; }
  else { prev.style.display = 'none'; document.getElementById('imgPlaceholder').style.display = 'block'; }
}
function clearImg() { setImgUrl(''); }

async function uploadImg(input) {
  const file = input.files[0]; if (!file) return;
  try {
    const url = await uploadFile(file);
    setImgUrl(url);
  } catch(e) { showAlert(document.getElementById('alert'), e.message, 'error'); }
}

async function save() {
  const body = {
    title: document.getElementById('title').value,
    excerpt: document.getElementById('excerpt').value,
    content: document.getElementById('content').value,
    image: imgUrlVal,
    category: document.getElementById('category').value,
    date: document.getElementById('date').value,
    published: document.getElementById('published').checked ? 1 : 0,
    featured: document.getElementById('featured').checked ? 1 : 0
  };
  if (!body.title) return showAlert(document.getElementById('alert'), 'כותרת שדה חובה', 'error');
  try {
    if (postId) await api('PUT', `/posts/${postId}`, body);
    else await api('POST', '/posts', body);
    showAlert(document.getElementById('alert'), 'נשמר בהצלחה ✓');
    setTimeout(() => location.href = 'posts', 1200);
  } catch(e) { showAlert(document.getElementById('alert'), e.message, 'error'); }
}
</script>
</body>
</html>
