<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>כניסה למנהל — חיידר בעל שם טוב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../flow.css">
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-box { width: 100%; max-width: 400px; margin: 0 auto; padding: 0 20px; }
  .login-card { background: rgba(255,255,255,.82); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.9); border-radius: 28px; padding: 44px 40px;
    box-shadow: 0 24px 64px rgba(14,58,70,.16); }
  .login-logo { text-align: center; margin-bottom: 32px; }
  .login-logo .logo-mark { width: 60px; height: 60px; border-radius: 50%; background: var(--grad-cool);
    color: #fff; font-family: var(--serif); font-size: 20px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 12px;
    box-shadow: 0 10px 28px rgba(14,58,70,.26); }
  .login-logo h1 { font-family: var(--serif); font-size: 22px; font-weight: 700; color: var(--ink); }
  .login-logo p { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--teal); margin-bottom: 6px; }
  .form-group input { width: 100%; padding: 12px 16px; border: 1.5px solid var(--line);
    border-radius: 12px; font-size: 15px; font-family: inherit; background: rgba(255,255,255,.85);
    color: var(--ink); direction: rtl; transition: .2s; }
  .form-group input:focus { outline: none; border-color: var(--aqua); box-shadow: 0 0 0 3px rgba(111,177,191,.18); background: #fff; }
  .err { font-size: 13px; color: #dc2626; margin-bottom: 12px; display: none; }
</style>
</head>
<body>
<div class="login-box">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-mark">בש"ט</div>
      <h1>כניסה למנהל</h1>
      <p>חיידר בעל שם טוב</p>
    </div>
    <div class="err" id="err"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>שם משתמש</label>
        <input type="text" id="username" required placeholder="admin" autocomplete="username" />
      </div>
      <div class="form-group">
        <label>סיסמה</label>
        <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-grad" style="width:100%;justify-content:center;margin-top:8px">כניסה</button>
    </form>
  </div>
</div>
<script>
  if (localStorage.getItem('bst_token')) location.href = '/admin/dashboard.html';
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const err = document.getElementById('err');
    err.style.display = 'none';
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value })
      });
      const data = await res.json();
      if (!res.ok) { err.textContent = data.error; err.style.display = 'block'; return; }
      localStorage.setItem('bst_token', data.token);
      localStorage.setItem('bst_user', data.username);
      location.href = '/admin/dashboard.html';
    } catch { err.textContent = 'שגיאת חיבור'; err.style.display = 'block'; }
  });
</script>
</body>
</html>
