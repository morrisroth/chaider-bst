<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>תיבת דואר — חיידר בעל שם טוב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../flow.css">
<link rel="stylesheet" href="admin.css">
<style>
.ibx { display: grid; grid-template-columns: 360px 1fr; gap: 22px; align-items: start; }
.ibx-panel { background: rgba(255,255,255,.82); border: 1px solid rgba(255,255,255,.95); border-radius: 20px;
  box-shadow: 0 8px 28px rgba(14,58,70,.07); overflow: hidden; }

/* filter tabs */
.ibx-tabs { display: flex; gap: 4px; padding: 6px; margin: 14px 14px 6px; background: rgba(14,58,70,.06); border-radius: 12px; }
.ibx-tab { flex: 1; border: 0; background: transparent; padding: 9px 10px; border-radius: 9px; font: inherit; font-size: 14px;
  font-weight: 600; color: var(--soft); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: .15s; }
.ibx-tab:hover { color: var(--ink); }
.ibx-tab.on { background: #fff; color: var(--teal); box-shadow: 0 2px 8px rgba(14,58,70,.1); }
.ibx-count { font-size: 11.5px; min-width: 22px; padding: 1px 7px; border-radius: 999px; background: rgba(14,58,70,.08); color: var(--soft); }
.ibx-tab.on .ibx-count { background: var(--teal); color: #fff; }

/* message list */
.ibx-list { max-height: calc(100vh - 230px); min-height: 200px; overflow-y: auto; padding: 4px 8px 10px; }
.ibx-item { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: right; border: 0; background: transparent;
  font: inherit; padding: 13px 12px; border-radius: 14px; cursor: pointer; transition: .15s; position: relative; }
.ibx-item + .ibx-item::before { content: ''; position: absolute; top: 0; right: 64px; left: 12px; height: 1px; background: rgba(14,58,70,.07); }
.ibx-item:hover { background: rgba(14,58,70,.04); }
.ibx-item.active { background: rgba(27,98,115,.09); }
.ibx-item.active::before, .ibx-item.active + .ibx-item::before { display: none; }
.ibx-item:focus-visible { outline: 2px solid var(--aqua); outline-offset: -2px; }
.ibx-av { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 16px; color: #fff; background: var(--grad-cool); }
.ibx-av.lg { width: 52px; height: 52px; font-size: 21px; }
.ibx-main { flex: 1; min-width: 0; }
.ibx-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ibx-name { font-size: 14.5px; color: var(--ink); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ibx-time { font-size: 11.5px; color: var(--muted); flex-shrink: 0; }
.ibx-subj { font-size: 13px; color: var(--soft); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ibx-prev { font-size: 12.5px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ibx-item.unread .ibx-name { font-weight: 700; }
.ibx-item.unread .ibx-subj { color: var(--ink); font-weight: 600; }
.ibx-item.unread .ibx-time { color: var(--teal); font-weight: 600; }
.ibx-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--teal); position: absolute; top: 50%; left: 14px; margin-top: -4px; }
.ibx-empty { text-align: center; padding: 48px 20px; color: var(--muted); font-size: 14px; }

/* reading pane */
.ibx-read { min-height: 420px; }
.ibx-none { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 420px;
  color: var(--muted); font-size: 15px; }
.ibx-none svg { width: 54px; height: 54px; color: rgba(27,98,115,.35); }
.ibx-head { display: flex; align-items: center; gap: 14px; padding: 22px 26px; border-bottom: 1px solid rgba(14,58,70,.08); }
.ibx-head .who { flex: 1; min-width: 0; }
.ibx-head .who b { display: block; font-family: var(--serif); font-size: 21px; color: var(--ink); line-height: 1.2; }
.ibx-head .who span { font-size: 13px; color: var(--muted); }
.ibx-tools { display: flex; gap: 6px; }
.ibx-tool { width: 38px; height: 38px; border-radius: 11px; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
  background: rgba(14,58,70,.06); color: var(--soft); transition: .15s; }
.ibx-tool svg { width: 18px; height: 18px; }
.ibx-tool:hover { background: rgba(14,58,70,.12); color: var(--ink); }
.ibx-tool.del:hover { background: rgba(239,68,68,.12); color: #dc2626; }
.ibx-tool:focus-visible { outline: 2px solid var(--aqua); outline-offset: 2px; }
.ibx-body { padding: 24px 26px 28px; }
.ibx-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
.ibx-chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: 999px; font-size: 13.5px;
  background: rgba(27,98,115,.07); color: var(--teal); text-decoration: none; direction: ltr; transition: .15s; }
.ibx-chip:hover { background: rgba(27,98,115,.14); }
.ibx-chip svg { width: 15px; height: 15px; }
.ibx-subject { font-family: var(--serif); font-size: 19px; font-weight: 700; color: var(--ink); margin-bottom: 12px; }
.ibx-msg { background: rgba(14,58,70,.035); border-radius: 16px; padding: 18px 20px; font-size: 15.5px; line-height: 1.85;
  color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
.ibx-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.ibx-actions .btn svg { width: 17px; height: 17px; }
.btn-wa { background: #25d366; color: #fff; border-color: transparent; }
.btn-wa:hover { background: #1fb457; }
.ibx-back { display: none; }

@media (max-width: 900px) {
  .ibx { grid-template-columns: 1fr; }
  .ibx.reading .ibx-listpanel { display: none; }
  .ibx:not(.reading) .ibx-read { display: none; }
  .ibx-list { max-height: none; }
  .ibx-back { display: flex; }
  .ibx-head { padding: 16px 18px; }
  .ibx-body { padding: 18px; }
}
</style>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <a class="sidebar-logo" href="/admin/dashboard"><img class="logo-mark" src="/assets/logo.png" alt="חיידר בעל שם טוב"><span><span>חיידר בעל שם טוב</span><br><small>פאנל ניהול</small></span></a>
    <nav class="sidebar-nav">
      <div class="sidebar-section">ראשי</div>
      <a href="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>לוח בקרה</a>
      <div class="sidebar-section">תוכן</div>
      <a href="posts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/></svg>חדשות ואירועים</a>
      <a href="gallery"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>גלריה</a>
      <div class="sidebar-section">הרשמה</div>
      <a href="registrations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>הרשמות</a>
      <a href="inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>תיבת דואר</a>
      <div class="sidebar-section">מסמכים</div>
      <a href="documents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 15l2 2 4-4"/></svg>מסמכים לחתימה</a>
      <div class="sidebar-section">הגדרות</div>
      <a href="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/></svg>הגדרות האתר</a>
    </nav>
    <div class="sidebar-footer"><span id="admin-username"></span> · <a href="#" onclick="logout()">יציאה</a></div>
  </aside>

  <div class="admin-main">
    <div class="admin-topbar">
      <div><h1>תיבת דואר</h1><div class="breadcrumb">הודעות ופניות מהאתר</div></div>
    </div>
    <div class="admin-body">
      <div class="ibx" id="ibx">
        <!-- Message list -->
        <div class="ibx-panel ibx-listpanel">
          <div class="ibx-tabs" role="tablist">
            <button class="ibx-tab on" id="f-all" role="tab" onclick="setFilter('all')">הכל <span class="ibx-count" id="c-all">0</span></button>
            <button class="ibx-tab" id="f-unread" role="tab" onclick="setFilter('unread')">לא נקראו <span class="ibx-count" id="c-unread">0</span></button>
          </div>
          <div class="ibx-list" id="msgList"><div class="ibx-empty">טוען...</div></div>
        </div>

        <!-- Reading pane -->
        <div class="ibx-panel ibx-read" id="readPane">
          <div class="ibx-none" id="noSel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 7l10 6 10-6"/></svg>
            בחרו הודעה מהרשימה כדי לקרוא אותה
          </div>
          <div id="msgDetail" style="display:none">
            <div class="ibx-head">
              <button class="ibx-tool ibx-back" onclick="closeMsg()" title="חזרה לרשימה" aria-label="חזרה לרשימה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
              <div class="ibx-av lg" id="mAv"></div>
              <div class="who"><b id="mName"></b><span id="mDate"></span></div>
              <div class="ibx-tools">
                <button class="ibx-tool" onclick="markUnread()" title="סימון כלא נקרא" aria-label="סימון כלא נקרא"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 7l10 6 10-6"/><circle cx="19" cy="5" r="3" fill="currentColor" stroke="none"/></svg></button>
                <button class="ibx-tool del" onclick="delMsg()" title="מחיקה" aria-label="מחיקה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg></button>
                <button class="ibx-tool" onclick="closeMsg()" title="סגירה (Esc)" aria-label="סגירה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
              </div>
            </div>
            <div class="ibx-body">
              <div class="ibx-chips" id="mChips"></div>
              <div class="ibx-subject" id="mSubject"></div>
              <div class="ibx-msg" id="mBody"></div>
              <div class="ibx-actions" id="mActions"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="admin.js"></script>
<script>
requireAuth();
let msgs = [], filter = 'all', selected = null;

async function load() {
  msgs = await api('GET', '/contact');
  render();
}

const ICON = {
  mail:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 7l10 6 10-6"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1.9.4 1.8.7 2.7a2 2 0 01-.5 2.1L8 9.8a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.4c.9.3 1.8.6 2.7.7a2 2 0 011.7 2z"/></svg>',
  wa:    '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm0 18.2a8.2 8.2 0 01-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 01-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 00-.7.3 3 3 0 00-.9 2.2 5.2 5.2 0 001.1 2.7 11.8 11.8 0 004.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 001.8-1.3 2.2 2.2 0 00.2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>'
};

function initial(name) { return (String(name || '?').trim()[0] || '?').toUpperCase(); }

function whenLabel(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date();
  const time = d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === now.toDateString()) return time;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return 'אתמול';
  return d.toLocaleDateString('he-IL', { day: 'numeric', month: 'short', ...(d.getFullYear() !== now.getFullYear() && { year: 'numeric' }) });
}

function fullDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) +
    ' · ' + d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
}

function waLink(phone) {
  const p = String(phone || '').replace(/\D/g, '');
  if (p.length < 9) return '';
  return 'https://wa.me/' + (p.startsWith('972') ? p : '972' + p.replace(/^0/, ''));
}

function setFilter(f) {
  filter = f;
  document.querySelectorAll('.ibx-tab').forEach(b => b.classList.toggle('on', b.id === 'f-' + f));
  render();
}

function render() {
  document.getElementById('c-all').textContent = msgs.length;
  document.getElementById('c-unread').textContent = msgs.filter(m => !m.read).length;
  const unreadBadge = document.getElementById('unread-badge');
  if (unreadBadge) { const n = msgs.filter(m => !m.read).length; unreadBadge.textContent = n; unreadBadge.style.display = n ? '' : 'none'; }

  const list = filter === 'unread' ? msgs.filter(m => !m.read) : msgs;
  document.getElementById('msgList').innerHTML = list.map(m => `
    <button type="button" class="ibx-item${m.read ? '' : ' unread'}${selected?.id === m.id ? ' active' : ''}" onclick="select('${m.id}')">
      <div class="ibx-av">${escHtml(initial(m.name))}</div>
      <div class="ibx-main">
        <div class="ibx-row"><div class="ibx-name">${escHtml(m.name || 'ללא שם')}</div><div class="ibx-time">${whenLabel(m.submittedAt)}</div></div>
        <div class="ibx-subj">${escHtml(m.subject || 'ללא נושא')}</div>
        <div class="ibx-prev">${escHtml(m.message || '')}</div>
      </div>
      ${m.read ? '' : '<span class="ibx-dot" aria-label="לא נקרא"></span>'}
    </button>`).join('') ||
    `<div class="ibx-empty">${filter === 'unread' ? 'אין הודעות שלא נקראו 🎉' : 'אין הודעות עדיין'}</div>`;
}

async function select(id) {
  selected = msgs.find(m => m.id === id); if (!selected) return;
  showDetail();
  if (!selected.read) {
    try {
      const upd = await api('PATCH', `/contact/${selected.id}`, { read: true });
      msgs = msgs.map(m => m.id === upd.id ? upd : m);
      if (selected?.id === upd.id) selected = upd;
    } catch {}
  }
  render();
}

function showDetail() {
  const m = selected;
  document.getElementById('noSel').style.display = 'none';
  document.getElementById('msgDetail').style.display = 'block';
  document.getElementById('ibx').classList.add('reading');
  document.getElementById('mAv').textContent = initial(m.name);
  document.getElementById('mName').textContent = m.name || 'ללא שם';
  document.getElementById('mDate').textContent = fullDate(m.submittedAt);
  document.getElementById('mSubject').textContent = m.subject || 'ללא נושא';
  document.getElementById('mBody').textContent = m.message || '';

  const email = (m.email || '').trim(), phone = (m.phone || '').trim(), wa = waLink(phone);
  document.getElementById('mChips').innerHTML =
    (email ? `<a class="ibx-chip" href="mailto:${escHtml(email)}">${ICON.mail}${escHtml(email)}</a>` : '') +
    (phone ? `<a class="ibx-chip" href="tel:${escHtml(phone.replace(/[^\d+]/g, ''))}">${ICON.phone}${escHtml(phone)}</a>` : '');
  const subj = encodeURIComponent('Re: ' + (m.subject || 'פנייתך לחיידר בעל שם טוב'));
  document.getElementById('mActions').innerHTML =
    (email ? `<a class="btn btn-grad btn-sm" href="mailto:${escHtml(email)}?subject=${subj}">${ICON.mail} השב במייל</a>` : '') +
    (wa ? `<a class="btn btn-wa btn-sm" href="${wa}" target="_blank" rel="noopener">${ICON.wa} WhatsApp</a>` : '') +
    (phone ? `<a class="btn btn-line btn-sm" href="tel:${escHtml(phone.replace(/[^\d+]/g, ''))}">${ICON.phone} התקשרות</a>` : '');
  document.getElementById('readPane').scrollIntoView({ block: 'nearest' });
}

function closeMsg() {
  selected = null;
  document.getElementById('msgDetail').style.display = 'none';
  document.getElementById('noSel').style.display = 'flex';
  document.getElementById('ibx').classList.remove('reading');
  render();
}

async function markUnread() {
  if (!selected) return;
  try {
    const upd = await api('PATCH', `/contact/${selected.id}`, { read: false });
    msgs = msgs.map(m => m.id === upd.id ? upd : m);
    closeMsg();
  } catch (e) { alert(e.message); }
}

async function delMsg() {
  if (!selected || !(await confirmDialog({ title: 'למחוק הודעה זו?', message: 'לא ניתן לבטל את הפעולה.', okText: 'כן, למחוק' }))) return;
  await api('DELETE', `/contact/${selected.id}`);
  msgs = msgs.filter(m => m.id !== selected.id);
  closeMsg();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && selected && !document.querySelector('.bst-cfm')) closeMsg();
});

load();
</script>
</body>
</html>
